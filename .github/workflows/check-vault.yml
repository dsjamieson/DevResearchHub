name: Check vault

on:
  pull_request:
  push:
    branches: [main, demo]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate notes, provenance, and links
        run: python3 tools/check_vault.py --stale 60
